<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bodySwift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Shadow on road -->
  <ellipse cx="220" cy="188" rx="180" ry="14" fill="#0f172a" opacity="0.25"/>
  <g filter="url(#carShadow)">
    <!-- Hatchback Silhouette -->
    <path d="M70,140 C65,130 75,100 95,95 C115,90 145,55 175,52 L260,52 C295,52 335,80 355,105 L375,125 C385,135 385,150 370,152 L70,152 Z" fill="url(#bodySwift)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Windows -->
    <path d="M170,60 L245,60 L245,100 L135,100 C150,80 162,65 170,60 Z" fill="url(#glass)"/>
    <path d="M255,60 L315,90 L315,100 L255,100 Z" fill="url(#glass)"/>
    <!-- Quarter glass -->
    <path d="M108,100 L125,100 L125,90 Z" fill="url(#glass)"/>
    <!-- Door seam & lines -->
    <line x1="250" y1="60" x2="250" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="165" y1="100" x2="165" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="220" y="110" width="22" height="5" rx="2" fill="#64748b"/>
    <rect x="140" y="110" width="22" height="5" rx="2" fill="#64748b"/>
    <!-- Headlamp -->
    <path d="M358,118 L375,125 L370,138 L350,132 Z" fill="#fde047" stroke="#eab308" stroke-width="1"/>
    <!-- Tail lamp -->
    <path d="M72,110 L84,110 L80,130 L70,126 Z" fill="#ef4444"/>
    <!-- Bumper & grill -->
    <path d="M365,145 L375,145 L370,152 L360,152 Z" fill="#475569"/>
    <!-- Commercial Number Plate (MH-02 Mumbai yellow plate) -->
    <rect x="360" y="146" width="18" height="6" rx="1" fill="#facc15" stroke="#000" stroke-width="0.5"/>
    <!-- Wheels and Alloys -->
    <circle cx="125" cy="155" r="30" fill="#1e293b"/>
    <circle cx="125" cy="155" r="20" fill="#94a3b8"/>
    <circle cx="125" cy="155" r="12" fill="#334155"/>
    <circle cx="125" cy="155" r="5" fill="#f8fafc"/>
    <circle cx="310" cy="155" r="30" fill="#1e293b"/>
    <circle cx="310" cy="155" r="20" fill="#94a3b8"/>
    <circle cx="310" cy="155" r="12" fill="#334155"/>
    <circle cx="310" cy="155" r="5" fill="#f8fafc"/>
  </g>
</svg>
