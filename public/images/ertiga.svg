<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyErtiga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glassErtiga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowErtiga" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Road Shadow -->
  <ellipse cx="230" cy="190" rx="200" ry="14" fill="#0f172a" opacity="0.25"/>
  <!-- Roof Rails -->
  <path d="M120,44 L320,44" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <rect x="135" y="44" width="8" height="6" fill="#334155"/>
  <rect x="220" y="44" width="8" height="6" fill="#334155"/>
  <rect x="300" y="44" width="8" height="6" fill="#334155"/>
  <g filter="url(#shadowErtiga)">
    <!-- SUV / Ertiga Tall Profile -->
    <path d="M60,145 L62,95 L95,85 L145,50 L330,50 L370,95 L405,120 L410,145 L60,145 Z" fill="url(#bodyErtiga)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- 3 Windows (7-seater look) -->
    <path d="M150,56 L220,56 L220,95 L110,95 Z" fill="url(#glassErtiga)"/>
    <path d="M228,56 L290,56 L290,95 L228,95 Z" fill="url(#glassErtiga)"/>
    <path d="M298,56 L355,88 L355,95 L298,95 Z" fill="url(#glassErtiga)"/>
    <path d="M80,95 L102,95 L102,88 L85,90 Z" fill="url(#glassErtiga)"/>
    <!-- Door lines -->
    <line x1="225" y1="56" x2="225" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="295" y1="56" x2="295" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="135" y1="95" x2="135" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="260" y="105" width="22" height="5" rx="2" fill="#64748b"/>
    <rect x="190" y="105" width="22" height="5" rx="2" fill="#64748b"/>
    <!-- Headlamp -->
    <path d="M385,115 L408,122 L402,136 L380,130 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
    <!-- Taillight Ertiga vertical style -->
    <path d="M64,95 L72,95 L72,132 L62,130 Z" fill="#ef4444"/>
    <!-- Number plate -->
    <rect x="390" y="138" width="18" height="6" rx="1" fill="#facc15" stroke="#000" stroke-width="0.5"/>
    <!-- Large Wheels for SUV -->
    <circle cx="120" cy="155" r="32" fill="#1e293b"/>
    <circle cx="120" cy="155" r="22" fill="#94a3b8"/>
    <circle cx="120" cy="155" r="14" fill="#334155"/>
    <circle cx="120" cy="155" r="6" fill="#f8fafc"/>
    <circle cx="335" cy="155" r="32" fill="#1e293b"/>
    <circle cx="335" cy="155" r="22" fill="#94a3b8"/>
    <circle cx="335" cy="155" r="14" fill="#334155"/>
    <circle cx="335" cy="155" r="6" fill="#f8fafc"/>
  </g>
</svg>
