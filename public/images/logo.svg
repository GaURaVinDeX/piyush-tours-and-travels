<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Icon Emblem -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#logoBg)"/>
    <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="url(#logoGold)" stroke-width="1.5"/>
    <!-- Stylized Cab / Compass Icon -->
    <path d="M12 28 C12 25 15 20 18 19 L30 19 C33 20 36 25 36 28 L38 34 L10 34 Z" fill="url(#logoGold)"/>
    <!-- Wheels -->
    <circle cx="16" cy="34" r="3.5" fill="#f8fafc"/>
    <circle cx="32" cy="34" r="3.5" fill="#f8fafc"/>
    <!-- Windshield -->
    <path d="M18 22 L30 22 L32 27 L16 27 Z" fill="#0f172a"/>
    <!-- Taxi Light on top -->
    <rect x="21" y="16" width="6" height="2.5" rx="1" fill="#f8fafc"/>
  </g>
  <!-- Text Brand -->
  <g transform="translate(62, 14)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
      PIYUSH <tspan fill="#d97706">TOURS</tspan>
    </text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="2.5">
      &amp; TRAVELS MUMBAI
    </text>
  </g>
</svg>
