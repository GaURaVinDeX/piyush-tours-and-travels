<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyDzire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glassDzire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadowDzire" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Road shadow -->
  <ellipse cx="230" cy="188" rx="200" ry="14" fill="#0f172a" opacity="0.25"/>
  <g filter="url(#shadowDzire)">
    <!-- Sedan Body (Sedan trunk profile) -->
    <path d="M50,135 L60,115 L105,110 L145,55 L265,52 L340,95 L395,115 L405,142 L50,142 Z" fill="url(#bodyDzire)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Trunk slope -->
    <path d="M50,135 L60,115 L105,110 L145,55" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Windows -->
    <path d="M148,60 L240,58 L240,98 L115,98 Z" fill="url(#glassDzire)"/>
    <path d="M250,58 L320,90 L320,98 L250,98 Z" fill="url(#glassDzire)"/>
    <!-- Door lines -->
    <line x1="245" y1="58" x2="245" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="98" x2="150" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="210" y="108" width="22" height="5" rx="2" fill="#64748b"/>
    <rect x="130" y="108" width="22" height="5" rx="2" fill="#64748b"/>
    <!-- Headlamp -->
    <path d="M380,115 L402,122 L396,134 L375,128 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
    <!-- Taillight -->
    <path d="M52,118 L70,118 L68,132 L50,130 Z" fill="#ef4444"/>
    <!-- Taxi Board on Roof (Piyush Cabs) -->
    <rect x="190" y="42" width="45" height="11" rx="3" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
    <text x="212" y="50" font-size="7" font-weight="900" text-anchor="middle" fill="#000" font-family="sans-serif">TAXI</text>
    <!-- Commercial Number Plate -->
    <rect x="385" y="136" width="20" height="6" rx="1" fill="#facc15" stroke="#000" stroke-width="0.5"/>
    <!-- Wheels -->
    <circle cx="115" cy="150" r="30" fill="#1e293b"/>
    <circle cx="115" cy="150" r="20" fill="#94a3b8"/>
    <circle cx="115" cy="150" r="12" fill="#334155"/>
    <circle cx="115" cy="150" r="5" fill="#f8fafc"/>
    <circle cx="330" cy="150" r="30" fill="#1e293b"/>
    <circle cx="330" cy="150" r="20" fill="#94a3b8"/>
    <circle cx="330" cy="150" r="12" fill="#334155"/>
    <circle cx="330" cy="150" r="5" fill="#f8fafc"/>
  </g>
</svg>
