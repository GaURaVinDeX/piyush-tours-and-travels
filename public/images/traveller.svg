<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyTraveller" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glassTraveller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowTraveller" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Road shadow -->
  <ellipse cx="250" cy="200" rx="230" ry="14" fill="#0f172a" opacity="0.25"/>
  <!-- Top AC Unit on Roof -->
  <rect x="180" y="24" width="140" height="14" rx="4" fill="#64748b"/>
  <rect x="200" y="28" width="100" height="4" rx="2" fill="#334155"/>
  <g filter="url(#shadowTraveller)">
    <!-- Van / Tempo Traveller Silhouette -->
    <path d="M45,160 L45,60 L70,38 L380,38 L430,75 L455,120 L460,160 L45,160 Z" fill="url(#bodyTraveller)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Large Passenger Windows Row -->
    <path d="M80,48 L140,48 L140,95 L80,95 Z" fill="url(#glassTraveller)"/>
    <path d="M148,48 L210,48 L210,95 L148,95 Z" fill="url(#glassTraveller)"/>
    <path d="M218,48 L280,48 L280,95 L218,95 Z" fill="url(#glassTraveller)"/>
    <path d="M288,48 L350,48 L350,95 L288,95 Z" fill="url(#glassTraveller)"/>
    <!-- Driver Front Windshield -->
    <path d="M358,48 L415,75 L415,95 L358,95 Z" fill="url(#glassTraveller)"/>
    <!-- Decorative side swoosh graphic -->
    <path d="M50,125 Q240,110 440,135" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <path d="M50,132 Q240,117 440,142" stroke="#d97706" stroke-width="2" fill="none"/>
    <!-- Passenger Sliding Door Seam -->
    <line x1="284" y1="45" x2="284" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="270" y="112" width="10" height="24" rx="3" fill="#475569"/>
    <!-- Headlamp -->
    <path d="M435,125 L458,132 L452,148 L430,142 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
    <!-- Yellow Plate -->
    <rect x="435" y="150" width="22" height="7" rx="1" fill="#facc15" stroke="#000" stroke-width="0.5"/>
    <!-- Double Rear Wheel & Front Wheel -->
    <circle cx="120" cy="168" r="32" fill="#1e293b"/>
    <circle cx="120" cy="168" r="20" fill="#94a3b8"/>
    <circle cx="120" cy="168" r="12" fill="#334155"/>
    <circle cx="120" cy="168" r="5" fill="#f8fafc"/>
    <circle cx="370" cy="168" r="32" fill="#1e293b"/>
    <circle cx="370" cy="168" r="20" fill="#94a3b8"/>
    <circle cx="370" cy="168" r="12" fill="#334155"/>
    <circle cx="370" cy="168" r="5" fill="#f8fafc"/>
  </g>
</svg>
