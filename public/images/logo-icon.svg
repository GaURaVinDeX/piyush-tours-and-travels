<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="56" height="56" rx="14" fill="url(#iconBg)"/>
  <rect x="3" y="3" width="54" height="54" rx="13" fill="none" stroke="url(#iconGold)" stroke-width="2"/>
  
  <!-- Stylized Cab Emblem -->
  <g transform="translate(6, 6)">
    <!-- Cab Body -->
    <path d="M12 28 C12 24 15 19 19 18 L29 18 C33 19 36 24 36 28 L38 34 L10 34 Z" fill="url(#iconGold)"/>
    <!-- Wheels -->
    <circle cx="16" cy="34" r="3.5" fill="#f8fafc"/>
    <circle cx="32" cy="34" r="3.5" fill="#f8fafc"/>
    <!-- Windshield -->
    <path d="M18 21 L30 21 L32 26 L16 26 Z" fill="#0f172a"/>
    <!-- Taxi Light on top -->
    <rect x="21" y="15" width="6" height="2.5" rx="1" fill="#f8fafc"/>
  </g>
</svg>
